spring.datasource.url=jdbc:h2:mem:photobooth-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.security.user.name=user
spring.security.user.password=password

geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=PhotoBooth-Test/1.0
geocoding.nominatim.connect-timeout-ms=3000
geocoding.nominatim.read-timeout-ms=5000
geocoding.nominatim.min-interval-ms=1000


r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=https://pub-eb5177ad670844d39d8e4337e12d47dc.r2.dev

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

password-reset.expiration-minutes=30