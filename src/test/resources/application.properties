spring.security.user.name=user
spring.security.user.password=password

geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=PhotoBooth-Test/1.0
geocoding.nominatim.connect-timeout-ms=3000
geocoding.nominatim.read-timeout-ms=5000
geocoding.nominatim.min-interval-ms=1000


r2.account-id=test-account
r2.access-key-id=test-access-key
r2.secret-access-key=test-secret-key
r2.bucket-name=test-bucket

jwt.secret=test-only-jwt-secret-at-least-32-bytes-long
jwt.expiration-ms=3600000

password-reset.expiration-minutes=30

upload.max-file-size-bytes=20971520
upload.max-dimension-px=4096
upload.rate-limit.max-per-hour=100
upload.presigned-url.expiry-minutes=15

clamav.host=localhost
clamav.port=3310

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

cors.allowed-origins=http://localhost:5173