spring.application.name=photoBooth
server.port=9999
logging.level.root=INFO
logging.level.com.example.photoBooth=INFO
logging.level.org.springframework.security=DEBUG
spring.security.user.name=user
spring.security.user.password=password

spring.datasource.url=jdbc:postgresql://localhost:5432/photobooth
spring.datasource.username=photobooth
spring.datasource.password=photobooth
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=PhotoBooth/1.0 (contact: vickramshiv2004@gmail.com)
geocoding.nominatim.connect-timeout-ms=3000
geocoding.nominatim.read-timeout-ms=5000
geocoding.nominatim.min-interval-ms=1000

r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=https://pub-eb5177ad670844d39d8e4337e12d47dc.r2.dev

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

password-reset.expiration-minutes=30

upload.max-file-size-bytes=20971520
upload.max-dimension-px=4096
upload.rate-limit.max-per-hour=100
upload.presigned-url.expiry-minutes=15

clamav.host=localhost
clamav.port=3310

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB